
name: NEWSWORLD

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Create prompt
        run: |
          cat << 'EOF' > prompt.txt
          Analise os arquivos do repositório e atualize a playlist
          lista5.m3u conforme as instruções do projeto.
          Não exclua arquivos de backup nem arquivos fora do repositório.
          EOF

      - name: Run OpenCode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executando OpenCode..."
          opencode run "$(cat prompt.txt)"

      - name: Check generated files
        run: |
          echo "Arquivos no diretório:"
          ls -la

          if [ -f lista5.m3u ]; then
            echo "Playlist criada:"
            ls -lh lista5.m3u
          else
            echo "ERRO: lista5.m3u não foi criado"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lista5.m3u

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit"
            exit 0
          fi

          git commit -m "Atualização automática da playlist"

          BRANCH="${GITHUB_REF_NAME}"

          for i in {1..10}; do
            echo "Tentativa $i de push..."

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH" || {
              git rebase --abort
              echo "Falha no rebase"
              exit 1
            }

            if git push origin HEAD:"$BRANCH"; then
              echo "Push realizado com sucesso!"
              exit 0
            fi

            sleep 5
          done

          echo "ERRO: Não foi possível enviar alterações"
          exit 1
