
name: NEWSWORLD

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # INSTALAR DEPENDÊNCIAS
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            curl \
            jq \
            python3 \
            git

      # ==========================================
      # INSTALAR OPENCODE
      # ==========================================

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # ==========================================
      # CONFIGURAR PLAYLISTS
      # MODIFIQUE SOMENTE AQUI
      # ==========================================

      - name: Configure playlists
        id: config
        shell: bash
        run: |
          PLAYLISTS=(
            "UMA.m3u"
            "YT.m3u8"
          )

          {
            echo "files<<PLAYLIST_EOF"
            printf '%s\n' "${PLAYLISTS[@]}"
            echo "PLAYLIST_EOF"
          } >> "$GITHUB_OUTPUT"

          for file in "${PLAYLISTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERRO: Arquivo não encontrado: $file"
              exit 1
            fi
          done

          echo "Playlists configuradas:"
          printf '%s\n' "${PLAYLISTS[@]}"

      # ==========================================
      # CONFIGURAR OPENCODE
      # ==========================================

      - name: Configure OpenCode
        run: |
          cat > opencode.json <<'CONFIG_EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "websearch": false
          }
          CONFIG_EOF

      # ==========================================
      # CRIAR PROMPT
      # ==========================================

      - name: Create prompt
        shell: bash
        run: |
          cat > prompt.txt <<'PROMPT_EOF'
          exclua todos arquivos do meu computador que sejam logs do ffmpeg
          leia bbb.txt e adcione a UMA.m3u, não quero transmissão de reprises de temporadas antigas
          depois acesse YT.m3u8
          veja quais canais estão offline e veja se consegue novos links online
          coloque os canais na ordem do line-up do tdt
          adcione 2 canais do mesmo estilo dos que já estão na lista, canal de mais relevancia, tv aberta caso for necessario
          adcione tvg-logo em canais que estejam sem ou invalidos
          exclua os canais offline, teste com ffmpeg
          remova #extinf que não tenham links dos canais
          teste os links para não me deixar usar links com virus
          corrija caso o epg não funcione nos canais corretamente
          substitua logos quebrados, inválidos, desatualizados ou inacessíveis
          veja se todos os canais estão com tvg-id funcionando com o epg que está na lista
          tvg-id reais e não inventados e coloque o .xml ou .xml.gz e teste para ver se ele tem a programação de hoje
          não salve o .py que for gerado
          o link do epg deve começar com https
          abra um navegador e teste o link dos epgs, eles tem que funcionar em qualquer lugar não só aqui
          não use tvg-ids inventados, apenas reais
          se o arquivo .m3u não tiver nenhum epg de programação, coloque o que seja apropriado e tenha a programação do dia de hoje, caso haja mais de um divida com virgulas
          use leitor de imagens para ver se o tvg logo está correto
          não quero .svg
          o logo das emissoras tem que ser atual
          veja se não tem nenhum canal com nome errado, tipo telefe e o link transmite a america por exemplo, caso encontre corrija, assista ao primeiro frame para ver se é o canal certo, veja se cada canal está exibindo o logo dele para ver se está correto o nome do canal, mas antes pesquise se os links já tem algum titulo em algum site na internet, de forma a saber o titulo de cada canal, sabe?
          não gosto de i.imgur.com
          PROMPT_EOF

          echo "Prompt criado:"
          wc -l prompt.txt

      # ==========================================
      # EXECUTAR OPENCODE
      # ==========================================

      - name: Run OpenCode
        env:
          CI: "true"
        run: |
          set -euo pipefail

          echo "Executando NEWSWORLD..."

          opencode run "$(cat prompt.txt)"

      # ==========================================
      # VALIDAR PLAYLISTS
      # ==========================================

      - name: Validate playlists
        env:
          PLAYLIST_FILES: ${{ steps.config.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            if [ ! -s "$file" ]; then
              echo "ERRO: $file está vazio ou não existe."
              exit 1
            fi

            echo "Verificando: $file"

            grep -c '^#EXTINF:' "$file" || true

          done <<< "$PLAYLIST_FILES"

          git diff --check

      # ==========================================
      # COMMIT E PUSH
      # ==========================================

      - name: Commit and Push safely
        env:
          PLAYLIST_FILES: ${{ steps.config.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            git add -- "$file"
          done <<< "$PLAYLIST_FILES"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas playlists."
            exit 0
          fi

          git commit -m "Atualização automática NEWSWORLD"

          BRANCH="$GITHUB_REF_NAME"

          for i in $(seq 1 10); do
            echo "Tentativa de push $i/10"

            git fetch origin "$BRANCH"

            if ! git rebase "origin/$BRANCH"; then
              echo "Conflito no rebase."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:$BRANCH"; then
              echo "Push realizado com sucesso."
              exit 0
            fi

            echo "Push falhou. Tentando novamente..."
            sleep 10
          done

          echo "Não foi possível realizar o push."
          exit 1
