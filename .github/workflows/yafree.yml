name: ya

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "O que você quer gerar"
        required: true
        type: string
      filename:
        description: "Nome do arquivo de saída (ex: lista.m3u)"
        required: true
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify installation
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          which opencode
          opencode --version

      - name: Run OpenCode and save output
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          OUTPUT: ${{ github.event.inputs.filename }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"

          opencode run "use Crawl4ai, yt-dlp, aria2, caso necessário e ${PROMPT}" > "${OUTPUT}"

          echo "Arquivo gerado:"
          ls -lh "${OUTPUT}"

      - name: Commit generated file safely
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add "${{ github.event.inputs.filename }}"

          git commit -m "Adiciona arquivo gerado" || echo "Nada para commit"

          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && break || sleep 2
          done

          for i in 1 2 3; do
            git push origin HEAD:"${{ github.ref_name }}" && break || sleep 2
          done
